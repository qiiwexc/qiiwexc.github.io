name: Create Release
description: Create a GitHub release with build artifacts

inputs:
  tag:
    description: The tag name to release
    required: true

runs:
  using: composite
  steps:
    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: build-output
        path: artifacts

    - name: Generate checksums
      shell: bash
      working-directory: artifacts/build
      run: sha256sum qiiwexc.bat qiiwexc.ps1 autounattend-*.xml > SHA256SUMS.txt

    # The checksums file is written beside the assets, so it shows a download is intact, not that
    # this workflow made it. A signed provenance attestation of every file it lists does: it binds
    # each digest to this repository, workflow and commit, and 'gh attestation verify' checks it.
    # Made before the release, so a failure leaves no release without one
    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: artifacts/build/SHA256SUMS.txt

    - name: Create release
      shell: bash
      working-directory: artifacts/build
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes \
          --notes 'SHA-256 checksums for the release assets are attached as `SHA256SUMS.txt`.' \
          qiiwexc.bat qiiwexc.ps1 autounattend-*.xml SHA256SUMS.txt
