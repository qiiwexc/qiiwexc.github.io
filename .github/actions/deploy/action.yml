name: Deploy to GitHub Pages
description: Check for existing release and deploy build artifacts to GitHub Pages

outputs:
  tag:
    description: The tag being released
    value: ${{ steps.check.outputs.tag }}
  should_release:
    description: Whether a new GitHub release should be created
    value: ${{ steps.check.outputs.should_release }}
  page_url:
    description: The deployed GitHub Pages URL
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: Check for existing release
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "Release $TAG already exists, skipping"
          echo "should_release=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "should_release=true" >> $GITHUB_OUTPUT

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-output
        path: artifacts

    # Publish an explicit list of files rather than the working directory, so nothing else
    # from the repository ends up on the site, where end users download and run it
    - name: Assemble site
      shell: bash
      run: |
        mkdir -p _site/d _site/public
        cp artifacts/build/index.html artifacts/build/qiiwexc.bat artifacts/build/qiiwexc.ps1 artifacts/build/autounattend-*.xml _site/
        cp artifacts/public/favicon.ico _site/
        cp artifacts/public/scripts.js artifacts/public/Office_Installer.zip _site/public/
        cp artifacts/d/qiiwexc.bat artifacts/d/stylesheet.css _site/d/

    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
