version: 2

updates:
  # The workflows and every composite action in one entry, so a bump moves every pin of an action in one pull request
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      github-actions-patch-updates:
        update-types:
          - "patch"
          - "minor"
      # One pull request per action, across every directory that uses it
      github-actions-major-updates:
        update-types:
          - "major"
        group-by: dependency-name
