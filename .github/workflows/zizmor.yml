name: zizmor

permissions: {}

on:
  push:
    branches: [master]
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to check out the repository and by zizmor's online audits
      actions: read # Required by upload-sarif to read workflow run metadata
      security-events: write # Required by upload-sarif to publish findings to code scanning
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Upload findings as SARIF to code scanning instead of reporting
          # them as inline annotations; the job does not fail on findings
          advanced-security: true
