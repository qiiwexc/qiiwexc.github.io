name: zizmor

permissions: {}

on:
  push:
    branches: [master]
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to check out the repository and by zizmor's online audits
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Findings become annotations on the run and the pull request, and any of them fails the
          # job; SARIF for code scanning would not, as zizmor exits 0 whatever it finds in that
          # format. A finding accepted on purpose is suppressed where it occurs, with a
          # '# zizmor: ignore[<audit>]' comment saying why
          advanced-security: false
          annotations: true
