name: Nightly dependency update

permissions:
  contents: read

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Fetches and parses third-party pages and downloads, so it runs with a read-only token and no
  # stored git credentials — only the updated dependencies file and the quarantine state leave this job
  check-for-updates:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # Required to download the quarantine state of the previous run
    outputs:
      has_updates: ${{ steps.update.outputs.has_updates }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # When each version newer than the recorded one was first seen, which holds it back until its quarantine
      # ends. Only this workflow's own runs on master are asked for it, so a pull request, a fork's included,
      # can never hand the check a state that makes a version look older than it is
      - name: Restore quarantine state
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .\tools\common\Write-WorkflowAnnotation.ps1
          # gh reports a run without the artifact on stderr, which 'Stop' would turn into a terminating error.
          # What it reports is kept: the warning is all that a reader without a token sees of why nothing was restored
          $ErrorActionPreference = 'Continue'
          $listed = @(gh run list --repo $env:GITHUB_REPOSITORY --workflow update-dependencies.yml --branch master --limit 30 --json databaseId --jq '.[].databaseId' 2>&1)
          if ($LASTEXITCODE -ne 0) {
              Write-WorkflowAnnotation "Could not list the runs of this workflow, so every new version starts its wait now: $($listed -join ' ')"
              exit 0
          }
          $runs = @($listed | ForEach-Object { "$_" } | Where-Object { $_ -match '^\d+$' -and $_ -ne $env:GITHUB_RUN_ID })
          $failure = ''
          foreach ($run in $runs) {
              $output = @(gh run download $run --repo $env:GITHUB_REPOSITORY --name dependency-quarantine --dir build 2>&1)
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "Restored the quarantine state of run $run"
                  exit 0
              }
              # The most recent run's, as that is the one whose state the check should have had
              if (-not $failure) {
                  $failure = "run ${run}: $($output -join ' ')"
              }
          }
          if ($runs.Count -eq 0) {
              Write-WorkflowAnnotation 'No earlier run of this workflow on master, so every new version starts its wait now'
          } else {
              Write-WorkflowAnnotation "No quarantine state found in the last $($runs.Count) runs, so every new version starts its wait now. The most recent error, from $failure"
          }
          exit 0

      - name: Check for dependency updates
        id: update
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\tools\Invoke-DependencyUpdate.ps1

      # Every run, with updates or without, so the next one knows when each waiting version was first seen
      - name: Save quarantine state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-quarantine
          path: build/dependency-quarantine.json
          if-no-files-found: error
          retention-days: 30

      # The pull request description quotes third-party release notes, so it travels as a file
      # and reaches the next job's 'gh' as --body-file, never through an expression or a variable
      - name: Upload updated dependencies
        if: steps.update.outputs.has_updates == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updated-dependencies
          path: |
            resources/dependencies.json
            build/dependency-update.md
          if-no-files-found: error
          retention-days: 1

  create-pull-request:
    needs: check-for-updates
    if: needs.check-for-updates.outputs.has_updates == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required to push the update branch
      pull-requests: write # Required to create and edit the update pull request
    outputs:
      branch: ${{ steps.create-pr.outputs.branch }}
      sha: ${{ steps.create-pr.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Credentials are needed for the 'git push' of the update branch
          persist-credentials: true

      # Both files keep their paths relative to the repository root, the artifact's common root
      - name: Download updated dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updated-dependencies

      - name: Create pull request
        id: create-pr
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One standing branch: each night's run starts from master and force-pushes over it,
          # so a single open pull request always shows every pending update instead of one per day
          $now = Get-Date
          $branch = 'chore/update-dependencies'
          $title = "Update dependencies ($($now.ToString('yyyy.MM.dd')))"
          # Written by tools\Invoke-DependencyUpdate.ps1: the version table, the changelog links and the release notes
          $bodyFile = 'build/dependency-update.md'

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git checkout -b $branch
          git add resources/dependencies.json
          git commit -m $title
          git push origin $branch --force

          $existingPr = gh pr list --head $branch --json number --jq 'if length > 0 then .[0].number else empty end'
          if (-not $existingPr) {
              gh pr create --title $title --body-file $bodyFile --reviewer $env:GITHUB_REPOSITORY_OWNER
          } else {
              gh pr edit $existingPr --title $title --body-file $bodyFile
          }

          "branch=$branch" >> $env:GITHUB_OUTPUT
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

  # ci.yml skips this pull request, as it changes only resources/dependencies.json, because a run
  # it started for the bot's push would wait for approval; these two jobs check it instead, and
  # their commit statuses stand in for ci.yml's checks of the same names
  test:
    needs: create-pull-request
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write # Required to report the commit status on the update pull request
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-pull-request.outputs.branch }}
          persist-credentials: false

      - name: Test
        uses: $/.github/actions/test

      - name: Report status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ needs.create-pull-request.outputs.sha }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:SHA" `
              -f state=$state -f context=test -f description="Tests $state"

  build:
    needs: [create-pull-request, test]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write # Required to report the commit status on the update pull request
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-pull-request.outputs.branch }}
          persist-credentials: false

      - name: Build
        uses: $/.github/actions/build

      - name: Report status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ needs.create-pull-request.outputs.sha }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:SHA" `
              -f state=$state -f context=build -f description="Build $state"
